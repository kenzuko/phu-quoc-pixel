name: Deploy Pixel Island Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/CNAME
          grep -qx 'pixel.openphuquoc.com' dist/CNAME
          touch dist/.nojekyll

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixel-pages
          mkdir -p /tmp/pixel-pages
          cp -a dist/. /tmp/pixel-pages/
          cd /tmp/pixel-pages
          git init
          git checkout -b gh-pages
          git config user.name 'jotrip-pixel-bot'
          git config user.email 'jotrip-pixel-bot@users.noreply.github.com'
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Probe custom domain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code="$(curl -L -sS -o /tmp/pixel-live.html -w '%{http_code}' https://pixel.openphuquoc.com/ || true)"
            echo "Attempt ${attempt}: HTTP ${code}"
            if [ "$code" = '200' ] && grep -q 'PHU QUOC: PIXEL ISLAND' /tmp/pixel-live.html; then
              echo 'Custom domain is serving Pixel Island'
              exit 0
            fi
            sleep 5
          done
          echo 'Custom domain is not live yet. GitHub Pages may still need one-time enablement in repository settings.'
          exit 1
