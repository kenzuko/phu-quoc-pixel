name: Deploy Pixel Island Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          VITE_BUILD_SHA="$GITHUB_SHA" npm run build
          test -f dist/CNAME
          grep -qx 'pixel.openphuquoc.com' dist/CNAME
          printf '%s\n' "$GITHUB_SHA" > dist/build.txt
          cat > dist/latest.html <<EOF
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
              <meta http-equiv="Pragma" content="no-cache">
              <meta http-equiv="Expires" content="0">
              <title>Pixel Island Latest</title>
            </head>
            <body>
              <script>
                location.replace('/?_build=${GITHUB_SHA}');
              </script>
            </body>
          </html>
          EOF
          touch dist/.nojekyll

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pixel-pages
          mkdir -p /tmp/pixel-pages
          cp -a dist/. /tmp/pixel-pages/
          cd /tmp/pixel-pages
          git init
          git checkout -b gh-pages
          git config user.name 'jotrip-pixel-bot'
          git config user.email 'jotrip-pixel-bot@users.noreply.github.com'
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Probe compiled custom domain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl -L -sS -o /tmp/pixel-live.html -w '%{http_code}' https://pixel.openphuquoc.com/ || true)"
            live_sha="$(curl -L -fsSL https://pixel.openphuquoc.com/build.txt 2>/dev/null | tr -d '\r\n' || true)"
            echo "Attempt ${attempt}: HTTP ${code}, build ${live_sha:-missing}"
            if [ "$code" = '200' ] \
              && [ "$live_sha" = "$GITHUB_SHA" ] \
              && grep -q 'PHU QUOC: PIXEL ISLAND' /tmp/pixel-live.html \
              && grep -Eq 'src="(\./)?assets/index-[^"]+\.js"' /tmp/pixel-live.html \
              && ! grep -q '/src/main.ts' /tmp/pixel-live.html; then
              echo 'Custom domain is serving this exact compiled Pixel Island commit'
              exit 0
            fi
            sleep 5
          done
          echo 'Custom domain has not reached this deploy commit yet.'
          echo "Expected build: $GITHUB_SHA"
          echo "Observed build: ${live_sha:-missing}"
          exit 1
