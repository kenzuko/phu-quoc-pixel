name: Pixel Island CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pixel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install reproducibly
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify custom domain artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/CNAME
          grep -qx 'pixel.openphuquoc.com' dist/CNAME

      - name: Report bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh dist
          find dist -type f -maxdepth 3 -printf '%s %p\n' | sort -nr | head -20
