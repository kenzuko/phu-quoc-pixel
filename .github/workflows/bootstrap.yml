name: Bootstrap Pixel Island repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('.bootstrap-complete') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if repository is already bootstrapped
        id: gate
        shell: bash
        run: |
          if [ -f .bootstrap-complete ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pull clean Pixel foundation from JoTrip Lab
        if: steps.gate.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/phu-quoc-pixel-architecture-v1 \
            https://github.com/kenzuko/Jotrip-Lab.git /tmp/jotrip-lab
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/jotrip-lab/phu-quoc-pixel/ ./
          mkdir -p public
          printf '%s\n' 'pixel.openphuquoc.com' > public/CNAME
          printf '%s\n' 'standalone-repo-bootstrap-v1' > .bootstrap-complete

      - name: Commit clean foundation
        if: steps.gate.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jotrip-pixel-bot'
          git config user.email 'jotrip-pixel-bot@users.noreply.github.com'
          git add -A
          git commit -m 'chore: bootstrap standalone Pixel Island repository'
          git push origin HEAD:main
